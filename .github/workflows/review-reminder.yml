name: Daily Vocab Review Reminder

on:
  schedule:
    # 每天 UTC 00:00 (台灣時間 08:00) 與 UTC 12:00 (台灣時間 20:00) 自動執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支援手動點擊測試

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝專案相依套件
        run: npm install

      - name: 執行到期檢查並寄送 Gmail
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_ID: ${{ secrets.USER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/daily-review-notifier.mjs